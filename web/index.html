<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Git Séance</title>
  <meta name="description" content="Every deleted file is a ghost. Visit your repository's graveyard and summon one, powered by open-weight Gemma.">
  <meta name="theme-color" content="#0b0918">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Cormorant+Garamond:ital,wght@0,500;1,400;1,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <div class="sky" aria-hidden="true">
    <div class="stars"></div>
    <div class="moon"></div>
    <div class="fog fog-a"></div>
    <div class="fog fog-b"></div>
  </div>

  <header class="picado" id="picado" aria-hidden="true"></header>

  <nav class="topbar">
    <a class="brand" href="#/">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><use href="#ghost-glyph"/></svg>
      <span>Git Séance</span>
    </a>
    <div class="topbar-right">
      <span class="veil" id="veil" hidden>Día de los Muertos · the veil is thin tonight</span>
      <span class="model-badge" id="model-badge" title="The model that speaks for the dead">…</span>
    </div>
  </nav>

  <main id="app" tabindex="-1"></main>

  <div class="chamber" id="chamber" hidden role="dialog" aria-modal="true" aria-labelledby="chamber-title"></div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <footer class="site-footer">
    <span>Every deleted file is a ghost. Built on open weights for
      <a href="https://dev.to/challenges/hacktoberfest-week4-2026-10-26" target="_blank" rel="noopener">Hacktoberfest 2026 · Ghost in the Machine</a>.</span>
    <a href="https://github.com/YashAdake/git-seance" target="_blank" rel="noopener">Source on GitHub</a>
  </footer>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="ghost-glyph" viewBox="0 0 32 32">
        <path d="M16 2.5c-6.4 0-11 4.9-11 11.3V28c0 .9 1 1.3 1.7.7l2.2-2 2.3 2.1c.4.4 1 .4 1.4 0l2.4-2.1 2.4 2.1c.4.4 1 .4 1.4 0l2.3-2.1 2.2 2c.7.6 1.7.2 1.7-.7V13.8C27 7.4 22.4 2.5 16 2.5z" fill="currentColor"/>
        <circle cx="12" cy="13.5" r="2.1" fill="#0b0918"/><circle cx="20" cy="13.5" r="2.1" fill="#0b0918"/>
        <ellipse cx="16" cy="19.5" rx="1.8" ry="2.4" fill="#0b0918"/>
      </symbol>
      <symbol id="marigold" viewBox="0 0 24 24">
        <g fill="#ff9f1c"><circle cx="12" cy="5" r="4"/><circle cx="12" cy="19" r="4"/><circle cx="5" cy="12" r="4"/><circle cx="19" cy="12" r="4"/>
        <circle cx="7" cy="7" r="3.6"/><circle cx="17" cy="7" r="3.6"/><circle cx="7" cy="17" r="3.6"/><circle cx="17" cy="17" r="3.6"/></g>
        <circle cx="12" cy="12" r="4.4" fill="#ffd166"/><circle cx="12" cy="12" r="2" fill="#e07a00"/>
      </symbol>
    </defs>
  </svg>

  <script type="module" src="/assets/app.js"></script>
</body>
</html>
